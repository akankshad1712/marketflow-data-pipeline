services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketflow:marketflow@db:5432/marketflow
      API_KEY: ${API_KEY:-local-dev-key-change-me}
      MAX_BATCH_SIZE: 5000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketflow
      POSTGRES_PASSWORD: marketflow
      POSTGRES_DB: marketflow
    ports: ["5432:5432"]
    volumes: ["marketflow_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketflow -d marketflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marketflow_pg:
