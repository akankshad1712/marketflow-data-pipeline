[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketflow"
version = "1.0.0"
description = "Reliable market-data ingestion, validation, and deterministic replay engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "prometheus-client>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3", "mypy>=1.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
